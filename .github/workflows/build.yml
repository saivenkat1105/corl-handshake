name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing key
        run: keytool -genkeypair -keystore app/handshake.keystore -storetype PKCS12 -alias handshake -keyalg RSA -keysize 2048 -validity 10000 -storepass handshake -keypass handshake -dname "CN=Handshake"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk handshake.apk

      - name: Report build failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILURE|Could not" -A4 build.log | head -n 120 || true
            echo '----- tail -----'
            tail -n 60 build.log || true
            echo '```'
          } > report.md
          gh issue create --repo "${{ github.repository }}" --title "Build ${{ github.run_number }} failed" --body-file report.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Handshake v1.0.${{ github.run_number }}
          body: Download handshake.apk below and open it on your phone to install.
          files: handshake.apk
